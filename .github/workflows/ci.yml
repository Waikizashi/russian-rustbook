name: Проверки
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Инструменты
        run: |
          python3 scripts/install_ebook_tools.py
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          bash scripts/install_mdbook.sh
      - name: Структура, ссылки и код основной книги
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check_book.py
          python3 scripts/check_language.py
      - name: Сайт
        run: |
          .tools/mdbook build
          cd extras/bits-bytes
          python3 scripts/prepare_book.py
          ../../.tools/mdbook build --dest-dir ../../book/extras/bits-bytes
          ../../.tools/mdbook test
          cd ../..
          mkdir -p dist
          python3 scripts/check_site.py
      - name: EPUB
        run: |
          python3 scripts/build_ebooks.py
          python3 scripts/verify_epub.py
          epubcheck dist/*.epub
          cd extras/bits-bytes
          python3 scripts/build_ebooks.py
          python3 scripts/verify_epub.py
          epubcheck dist/*.epub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: russian-rustbook-offline
          path: |
            downloads/*.epub
            downloads/*.md
            downloads/*Markdown.zip
            extras/bits-bytes/dist/*.epub
            extras/bits-bytes/dist/*.md
  supplement:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    defaults:
      run:
        working-directory: extras/bits-bytes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
          rustup override set "${{ matrix.rust }}"
      - run: python3 scripts/check.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: python3 scripts/run_examples.py
      - run: python3 scripts/run_examples.py --release
