name: Новая версия оригинала
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Сравнить commits
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          python3 scripts/check_upstream.py --prepare
          cat upstream-status.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-status
          path: |
            upstream-status.md
            dist/upstream-update/
